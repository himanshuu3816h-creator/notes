
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hill Climb Adventure</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #182b40;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
h1 { color: #ffd43b; margin: 15px 0 5px; }
#game {
    display: block;
    width: 100%;
    max-width: 1000px;
    height: auto;
    margin: 12px auto;
    background: #80d9f5;
    border: 4px solid white;
    border-radius: 12px;
}
.stats {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    padding: 10px;
    font-size: 18px;
}
.controls {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 15px;
}
button {
    padding: 16px 28px;
    border: none;
    border-radius: 12px;
    background: #ffb52e;
    color: #222;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    touch-action: none;
}
button:active { background: #ffdf75; }
#restart { background: #42d392; }
small { color: #c8d7e8; }
</style>
</head>
<body>

<h1>🏎️ HILL CLIMB ADVENTURE</h1>
<small>Climb the hills, collect coins and don't crash!</small>

<div class="stats">
    <span>💰 Coins: <b id="coins">0</b></span>
    <span>⛽ Fuel: <b id="fuel">100</b>%</span>
    <span>📏 Distance: <b id="distance">0</b> m</span>
    <span>🚀 Speed: <b id="speed">0</b></span>
</div>

<canvas id="game" width="1000" height="500"></canvas>

<div class="controls">
    <button id="brake">◀ BRAKE</button>
    <button id="gas">GAS ▶</button>
    <button id="restart">↻ RESTART</button>
</div>

<small>Keyboard: ← Brake | → Accelerate | R Restart</small>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width, H = canvas.height;

let car, camera, coins, fuel, distance, gameOver, won;
let keys = { gas:false, brake:false };
let objects = [];
let terrain = [];
let frame = 0;

function heightAt(x) {
    return 365
      + 65 * Math.sin(x * 0.006)
      + 28 * Math.sin(x * 0.015)
      + 12 * Math.sin(x * 0.032);
}

function reset() {
    car = { x:100, y:250, vx:0, vy:0, angle:0, av:0 };
    camera = 0;
    coins = 0;
    fuel = 100;
    distance = 0;
    gameOver = false;
    won = false;
    frame = 0;
    objects = [];

    for(let x=450; x<20000; x+=300) {
        objects.push({
            x,
            y: heightAt(x)-75-Math.random()*35,
            type: Math.random() > 0.17 ? "coin":"fuel",
            taken:false
        });
    }
    updateStats();
}

function updateStats() {
    document.getElementById("coins").textContent = coins;
    document.getElementById("fuel").textContent = Math.max(0,Math.floor(fuel));
    document.getElementById("distance").textContent = distance;
    document.getElementById("speed").textContent = Math.abs(Math.round(car.vx));
}

function drawTerrain() {
    ctx.beginPath();
    ctx.moveTo(0,H);

    for(let x=camera; x<camera+W+20; x+=8) {
        ctx.lineTo(x-camera,heightAt(x));
    }

    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fillStyle = "#64b34c";
    ctx.fill();

    ctx.beginPath();
    for(let x=camera; x<camera+W+20; x+=8) {
        let sx=x-camera;
        if(x===camera) ctx.moveTo(sx,heightAt(x));
        else ctx.lineTo(sx,heightAt(x));
    }
    ctx.strokeStyle="#327b35";
    ctx.lineWidth=7;
    ctx.stroke();
}

function drawBackground() {
    let sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#65c8ef");
    sky.addColorStop(1,"#d5f5ff");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#fff";
    for(let i=0;i<5;i++) {
        let x=((i*250-camera*0.15)%1200+1200)%1200;
        ctx.beginPath();
        ctx.arc(x,90+i%2*45,25,0,Math.PI*2);
        ctx.arc(x+28,85+i%2*45,35,0,Math.PI*2);
        ctx.arc(x+60,95+i%2*45,23,0,Math.PI*2);
        ctx.fill();
    }

    ctx.fillStyle="#9acb9c";
    ctx.beginPath();
    ctx.moveTo(0,310);
    for(let x=0;x<=W;x+=5)
        ctx.lineTo(x,300+35*Math.sin((x+camera*.25)*.008));
    ctx.lineTo(W,H); ctx.lineTo(0,H);
    ctx.fill();
}

function drawCar() {
    ctx.save();
    ctx.translate(car.x-camera,car.y);
    ctx.rotate(car.angle);

    // Car body
    ctx.fillStyle="#e83b35";
    ctx.beginPath();
    ctx.roundRect(-48,-23,96,30,9);
    ctx.fill();

    // Window
    ctx.fillStyle="#bdeeff";
    ctx.beginPath();
    ctx.moveTo(-23,-23);
    ctx.lineTo(-10,-43);
    ctx.lineTo(20,-43);
    ctx.lineTo(34,-23);
    ctx.closePath();
    ctx.fill();

    // Wheels
    for(let x of [-30,30]) {
        ctx.fillStyle="#222";
        ctx.beginPath();
        ctx.arc(x,10,15,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle="#bbb";
        ctx.beginPath();
        ctx.arc(x,10,6,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();
}

function drawObjects() {
    objects.forEach(o=>{
        if(o.taken) return;
        let x=o.x-camera;
        if(x < -30 || x > W+30) return;

        ctx.fillStyle=o.type==="coin"?"#ffcf27":"#e74c3c";
        ctx.beginPath();
        ctx.arc(x,o.y,14,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="white";
        ctx.font="bold 16px Arial";
        ctx.textAlign="center";
        ctx.fillText(o.type==="coin"?"$":"F",x,o.y+6);
    });
}

function update() {
    if(gameOver) return;

    frame++;

    if(keys.gas && fuel>0) {
        car.vx += 0.16;
        fuel -= 0.035;
    }
    if(keys.brake) {
        car.vx -= 0.13;
    }

    car.vx *= 0.992;
    car.vx=Math.max(-5,Math.min(8,car.vx));

    car.vy += 0.32;
    car.x += car.vx;
    car.y += car.vy;

    // Ground collision
    let ground=heightAt(car.x);
    if(car.y+22 >= ground) {
        car.y=ground-22;
        car.vy=0;

        let slope=(heightAt(car.x+10)-heightAt(car.x-10))/20;
        let target=Math.atan(slope);

        car.angle += (target-car.angle)*0.15;
        car.av=0;
    }

    camera=Math.max(0,car.x-300);
    distance=Math.max(0,Math.floor(car.x/10));

    // Collect items
    objects.forEach(o=>{
        if(!o.taken &&
           Math.hypot(car.x-o.x,car.y-o.y)<40) {
            o.taken=true;
            if(o.type==="coin") coins++;
            else fuel=Math.min(100,fuel+30);
        }
    });

    if(fuel<=0 && Math.abs(car.vx)<0.5) {
        gameOver=true;
    }

    // Crash detection
    if(Math.abs(car.angle)>1.55) gameOver=true;
    if(car.y>H+100) gameOver=true;

    updateStats();
}

function draw() {
    drawBackground();
    drawTerrain();
    drawObjects();
    drawCar();

    if(gameOver) {
        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#fff";
        ctx.textAlign="center";
        ctx.font="bold 48px Arial";
        ctx.fillText("GAME OVER!",W/2,H/2);
        ctx.font="22px Arial";
        ctx.fillText("Coins: "+coins+" | Distance: "+distance+" m",W/2,H/2+45);
        ctx.fillText("Press R or RESTART to play again",W/2,H/2+85);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function bindButton(id,key) {
    let b=document.getElementById(id);
    b.addEventListener("pointerdown",e=>{
        e.preventDefault();
        keys[key]=true;
    });
    ["pointerup","pointerleave","pointercancel"].forEach(evt=>{
        b.addEventListener(evt,()=>keys[key]=false);
    });
}

bindButton("gas","gas");
bindButton("brake","brake");

document.getElementById("restart").onclick=reset;

document.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight") keys.gas=true;
    if(e.key==="ArrowLeft") keys.brake=true;
    if(e.key.toLowerCase()==="r") reset();
});
document.addEventListener("keyup",e=>{
    if(e.key==="ArrowRight") keys.gas=false;
    if(e.key==="ArrowLeft") keys.brake=false;
});

reset();
loop();
</script>
</body>
</html>
